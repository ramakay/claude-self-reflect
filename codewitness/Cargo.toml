[package]
name = "codewitness"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Deterministic, evidence-grounded staleness detection for code-anchored claims. Zero LLM, zero wall-clock time — causal ordering via git ancestry only."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ramakay/claude-self-reflect"
readme = "README.md"
keywords = ["git", "provenance", "staleness", "diff", "witness"]
categories = ["development-tools", "algorithms"]
publish = false

[dependencies]
# NOTE: "sha1" is a gix *default* feature (object-hash backend) that is not
# pulled in transitively by "revision" or "blob-diff" — with
# default-features = false it must be requested explicitly or opening any
# ordinary (SHA-1) repository fails. See README / codewitness report for
# the full list of gix 0.86 discoveries vs. the original design sketch.
gix = { version = "0.86", default-features = false, features = ["revision", "blob-diff", "sha1"] }
blake3 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = []
serde = ["dep:serde", "gix/serde"]

[dev-dependencies]
# Only exercised by `tests/adversarial.rs`'s `successor_forgery` module,
# which is itself `#[cfg(feature = "serde")]`-gated (it round-trips a
# `Witness` through JSON to construct forged committed-tier evidence for
# negative tests — see that module's doc comment).
serde_json = "1"
