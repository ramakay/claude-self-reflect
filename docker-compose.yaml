volumes:
  qdrant_data:

services:
  # Qdrant vector database - the heart of semantic search
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: claude-reflection-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      # Note: Using CONFIG_PATH variable to support global npm installs (fixes #71)
      # macOS Docker Desktop restricts mounts to /Users, /Volumes, /private, /tmp
      - ${CONFIG_PATH:-${HOME}/.claude-self-reflect/config}/qdrant-config.yaml:/qdrant/config/config.yaml:ro
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    mem_limit: ${QDRANT_MEMORY:-4g}
    memswap_limit: ${QDRANT_MEMORY:-4g}

  # DEPRECATED: All Python services removed — replaced by csr-engine (Rust)
  #
  # Removed services:
  #   init-permissions  - Alpine utility (no longer needed)
  #   importer          - replaced by: csr-engine --import
  #   watcher           - replaced by: csr-engine daemon --watch
  #   streaming-importer - replaced by: csr-engine daemon
  #   async-importer    - replaced by: csr-engine daemon
  #   safe-watcher      - replaced by: csr-engine daemon --watch
  #   mcp-server        - replaced by: csr-engine --serve
  #   batch-watcher     - replaced by: csr-engine daemon (Layer 3 enrichment)
  #   batch-monitor     - replaced by: csr-engine daemon (narrator loop)
  #
  # The Python batch watcher had a path mismatch bug causing $38 in duplicate processing.
  # Use instead: csr-engine daemon (handles file watching + Layer 1/2/3 enrichment)

networks:
  default:
    name: claude-reflection-network
    external: false
