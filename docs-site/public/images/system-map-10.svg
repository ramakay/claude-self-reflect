<text x="330" y="448" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b645b" text-anchor="middle">inject / record</text>
<text x="40" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b645b" text-anchor="start">Enrichment tiers: L1 heuristic at import (free) | L2 V3 extract at session end (free) | L3 AI narrative, batch daemon (metered, optional).</text>

