<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-labelledby="t d">
<title id="t">CSR architecture</title><desc id="d">JSONL transcripts are imported, embedded locally and stored in SQLite with an HNSW index. The daemon enriches, the MCP server (16 tools) answers searches, and 8 hooks inject and record context for Claude Code.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#c8442a"/></marker></defs>
<rect width="1000" height="548" fill="#f5f2eb"/>
<text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="normal" fill="#24211e" text-anchor="start">Architecture</text>
<text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b645b" text-anchor="start">One Rust binary. Hooks and the MCP server run without the daemon.</text>
<rect x="40" y="100" width="160" height="64" rx="2" fill="#fdfbf6" stroke="#d8d2c8" stroke-width="1"/>
