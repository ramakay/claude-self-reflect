name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  # Run the full-history scan by hand: the scheduled scan and a pull request's scan
  # differ, so a fix for the scheduled one could not be checked before Monday.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit
      - run: cargo audit --file csr-engine/Cargo.lock
