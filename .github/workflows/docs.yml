name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # react-router 8 requires node >=22.22.0; 24 clears that and vite 7's
          # floor without depending on how setup-node resolves a bare "22".
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build docs
        run: npm run build
        working-directory: docs-site

      # One Pages artifact: the anatomy landing (site/) at the root, the docs
      # app under docs/. site/404.html sends misses to the landing or the docs,
      # and the landing forwards old #/docs/<slug> links to docs/.
      - name: Assemble Pages site
        env:
          OUT: _site
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT/docs"
          cp -R site/. "$OUT/"
          cp -R docs-site/dist/. "$OUT/docs/"
          test -f "$OUT/index.html" && test -f "$OUT/404.html" && test -f "$OUT/docs/index.html"
          # GitHub rejects files over 100 MB; warn from 50 MB.
          big=$(find "$OUT" -type f -size +100M)
          if [ -n "$big" ]; then echo "::error::files over 100 MB: $big"; exit 1; fi
          find "$OUT" -type f -size +50M -exec echo "::warning::file over 50 MB: {}" \;
          du -sh "$OUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
