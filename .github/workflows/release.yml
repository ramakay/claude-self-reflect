name: Release

on:
  push:
    tags: ['v*']
    # A branch named release/vX.Y.Z releases tag vX.Y.Z; the tag is
    # created by the release step when it publishes.
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v9.3.1). Created at the dispatched ref by the release step if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --manifest-path csr-engine/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path csr-engine/Cargo.toml --locked -- -D warnings

  build:
    needs: test
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: csr-engine-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: csr-engine-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: csr-engine-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --manifest-path csr-engine/Cargo.toml

      - name: Package binary
        run: |
          cd csr-engine/target/release
          tar -czvf ${{ matrix.artifact }} csr-engine
          mv ${{ matrix.artifact }} ../../../

      - name: Generate checksum
        run: shasum -a 256 ${{ matrix.artifact }} >> checksums-${{ matrix.target }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            checksums-${{ matrix.target }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Combine checksums
        run: cat checksums-*.txt > checksums.txt

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF_NAME#release/}}" >> "$GITHUB_OUTPUT"

      # target_commitish only decides where GitHub creates a tag that does not
      # exist yet — it never moves an existing one. A workflow_dispatch can name
      # an already-published tag while running from an unrelated ref, which would
      # attach artifacts built from GITHUB_SHA to a release whose tag points
      # somewhere else. Fail closed on that case before anything is uploaded.
      - name: Verify tag matches built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A missing ref is a 404, and gh still writes the error body to stdout,
          # so branch on the exit status and then on the parsed shape — never on
          # whether stdout was empty.
          if ! ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            echo "Tag ${TAG} does not exist yet — it will be created at ${GITHUB_SHA}."
            exit 0
          fi
          object_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')"
          object_type="$(printf '%s' "$ref_json" | jq -r '.object.type // empty')"
          if [ -z "$object_sha" ]; then
            echo "No exact tag ${TAG} resolved — it will be created at ${GITHUB_SHA}."
            exit 0
          fi
          # Annotated tags point at a tag object; peel it to reach the commit.
          if [ "$object_type" = "tag" ]; then
            commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
          else
            commit="$object_sha"
          fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${TAG} points at ${commit}, but these artifacts were built from ${GITHUB_SHA}. Refusing to publish."
            exit 1
          fi
          echo "Tag ${TAG} already points at the built commit ${GITHUB_SHA}."

      # target_commitish pins a newly created tag to the commit these artifacts
      # were built from. Without it action-gh-release falls back to the
      # repository default branch, so a release started from a release/v* branch
      # (or a dispatch on any non-default ref) tags code that was never built.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            *.tar.gz
            checksums.txt
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
