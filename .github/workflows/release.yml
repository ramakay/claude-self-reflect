# To require a review before a release can proceed (not yet applied — this
# workflow deliberately does not call the GitHub API to change repository or
# environment settings; run this by hand, once, as a repo admin):
#
#   gh api --method PUT repos/ramakay/claude-self-reflect/environments/prod \
#     --input - <<'JSON'
#   {
#     "prevent_self_review": false,
#     "reviewers": [
#       { "type": "User", "id": 1927846 }
#     ]
#   }
#   JSON
#
# prevent_self_review is false on purpose: reviewer 1927846 (ramakay, the repo
# owner) is also the person who pushes release tags. With a single reviewer,
# prevent_self_review:true would mean the actor can never approve their own
# deployment and no release could ever pass the gate.
name: Release

on:
  push:
    tags: ['v*']

# Serialize releases so two runs for the same tag cannot interleave around the
# tag claim. This is defence in depth only — the atomic ref POST in the
# stage-release job is what actually decides the winner.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --manifest-path csr-engine/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path csr-engine/Cargo.toml --locked --all-targets -- -D warnings

  build:
    needs: test
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: csr-engine-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: csr-engine-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: csr-engine-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --manifest-path csr-engine/Cargo.toml

      - name: Package binary
        run: |
          cd csr-engine/target/release
          tar -czvf ${{ matrix.artifact }} csr-engine
          mv ${{ matrix.artifact }} ../../../

      - name: Generate checksum
        run: shasum -a 256 ${{ matrix.artifact }} >> checksums-${{ matrix.target }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            checksums-${{ matrix.target }}.txt

  stage-release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Checked out only for .github/scripts/release-tag.sh. Pinned to the built
      # commit so the verifier is the one from the code being released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Combine checksums
        run: cat checksums-*.txt > checksums.txt

      - name: Resolve release tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # The invariant: the tag must name the commit these artifacts were built
      # from. Checking whether the tag exists and then letting the release step
      # create it is a check-then-use race — two runs for the same absent tag
      # both pass, one creates the tag, and the other uploads artifacts built
      # from a different commit onto it. Claim it atomically instead; ref
      # creation is rejected when the ref already exists, so the API decides the
      # winner. A run that loses the claim — or that was always going to reuse an
      # existing tag, as on tag push — must prove the tag names its own commit.
      - name: Claim release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/release-tag.sh claim

      # Staged as a draft: refs stay mutable, so nothing becomes public until the
      # tag has been re-checked in the publish-release job with the assets
      # already in place.
      - name: Stage draft release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            *.tar.gz
            checksums.txt
          generate_release_notes: true

  publish-release:
    needs: stage-release
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # Checked out only for .github/scripts/release-tag.sh, pinned to the same
      # commit as stage-release so the verifier matches the code being released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Point of no return. Between the claim and here, anyone with push access
      # could have force-updated or recreated the tag at another commit, and
      # target_commitish would not correct that. Re-resolve, then publish only if
      # the tag still names the commit these artifacts came from.
      #
      # This narrows the window; it does not close it. Verification and
      # publication are two API calls against a mutable ref, so a force-update
      # landing between them still yields a published release whose tag names a
      # different commit. Closing that requires a repository ruleset forbidding
      # update and deletion of v* tags — configuration this workflow cannot
      # assert. Until such a rule exists, treat this as defence in depth against
      # accident, not as a guarantee against a privileged writer.
      - name: Verify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage-release.outputs.tag }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_ID:-}" ] || { echo "::error::No release id from the stage-release job."; exit 1; }
          bash .github/scripts/release-tag.sh verify
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F make_latest=true >/dev/null
          echo "Published release ${TAG}."

  publish-npm:
    needs: publish-release
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
