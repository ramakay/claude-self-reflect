name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --manifest-path csr-engine/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path csr-engine/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path csr-engine/Cargo.toml --locked
      - name: Installer tests
        run: node --test installer/tests/*.test.js
      - name: Verify npm package
        run: npm pack --dry-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare home
        # Everything below runs under a throwaway HOME: the install writes under
        # $HOME/.claude-self-reflect and `claude plugin` under $HOME/.claude. The `runner` context is not
        # available in a job-level `env:`, so HOME is set for the steps below from here. cargo resolves under it too.
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-home"
          echo "HOME=$RUNNER_TEMP/plugin-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        # Claude Code is the host the generated plugin runs in, so it is the thing that tests and validates it.
        run: npm install -g @anthropic-ai/claude-code
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: csr-engine
      - name: Build the binary
        run: cargo build --manifest-path "$GITHUB_WORKSPACE/csr-engine/Cargo.toml" --locked --bin csr-engine
      - name: Relay test cases on a fresh emit
        # The binary writes the relay plugin (plugin.json, hooks.json, register.js); the fixture's cases run
        # against it under `claude plugin test`, with the engine scripted behind it.
        run: |
          "$GITHUB_WORKSPACE/csr-engine/target/debug/csr-engine" companion plugin emit "$RUNNER_TEMP/relay-under-test"
          mkdir "$RUNNER_TEMP/relay-under-test/tests"
          cp "$GITHUB_WORKSPACE/csr-engine/tests/fixtures/relay/relay.test.ts" "$RUNNER_TEMP/relay-under-test/tests/"
          claude plugin test "$RUNNER_TEMP/relay-under-test"
      - name: Install the plugin the binary writes, and validate it
        # `companion plugin install` is what `csr-engine setup` runs: it writes the local marketplace and has
        # Claude Code install the plugin from it.
        run: |
          "$GITHUB_WORKSPACE/csr-engine/target/debug/csr-engine" companion plugin install
          market="$HOME/.claude-self-reflect/csr-companion/marketplace"
          claude plugin validate "$market/plugins/csr-companion"
          claude plugin validate "$market/.claude-plugin/marketplace.json"
          claude plugin list --json | grep -q '"csr-companion@claude-self-reflect"'
