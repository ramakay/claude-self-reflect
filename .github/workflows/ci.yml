name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --manifest-path csr-engine/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path csr-engine/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path csr-engine/Cargo.toml --locked
      - name: Installer tests
        run: node --test installer/tests/*.test.js
      - name: Verify npm package
        run: npm pack --dry-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare home
        # The plugin's tests write under $HOME/.claude-self-reflect; keep that off the runner's real home. The
        # `runner` context is not available in a job-level `env:`, so HOME is set for the steps below from here.
        # `claude plugin test` and cargo both resolve under it.
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-home"
          echo "HOME=$RUNNER_TEMP/plugin-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Plugin TypeScript tests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin test "$GITHUB_WORKSPACE/plugins/csr-companion"
      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate "$GITHUB_WORKSPACE/plugins/csr-companion"
          claude plugin validate "$GITHUB_WORKSPACE/.claude-plugin/marketplace.json"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: csr-engine
      - name: Validate the plugin the binary writes
        # `csr-engine companion plugin emit` writes the relay plugin (plugin.json, hooks.json, register.js)
        # that `csr-engine companion plugin install` hands to Claude Code. Claude validates what the binary
        # emits, with the claude CLI the TypeScript step above installed.
        run: |
          cargo run --manifest-path "$GITHUB_WORKSPACE/csr-engine/Cargo.toml" --locked -- \
            companion plugin emit "$RUNNER_TEMP/emitted-plugin"
          claude plugin validate "$RUNNER_TEMP/emitted-plugin"
