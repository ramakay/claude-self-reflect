name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: write
  packages: write

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        cd mcp-server
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio
    
    - name: Run Python tests
      run: |
        cd mcp-server
        python -m pytest test_server.py || echo "No tests found"

  npm-package-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Test npm package structure
      run: |
        npm pack --dry-run
        node installer/cli.js help

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-test, npm-package-test]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker compose build

    - name: Test Docker stack
      run: |
        # Create config directory and copy qdrant config for mount
        mkdir -p ~/.claude-self-reflect/config
        cp config/qdrant-config.yaml ~/.claude-self-reflect/config/

        docker compose up -d qdrant
        sleep 10
        curl -f http://localhost:6333/ || exit 1
        docker compose down

  npm-global-install-test:
    needs: [python-test, npm-package-test]
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Docker Desktop
      run: |
        brew install --cask docker
        open -a Docker
        # Wait for Docker to start (max 5 minutes)
        timeout=300
        elapsed=0
        while ! docker info > /dev/null 2>&1; do
          if [ $elapsed -ge $timeout ]; then
            echo "Docker failed to start within 5 minutes"
            exit 1
          fi
          sleep 5
          elapsed=$((elapsed + 5))
        done
        echo "Docker is running"

    - name: Test global install and Docker mount fix
      run: |
        # Create npm package
        npm pack

        # Install globally (simulates user installation)
        npm install -g ./claude-self-reflect-*.tgz

        # Simulate setup copying config file to user directory
        mkdir -p ~/.claude-self-reflect/config
        cp config/qdrant-config.yaml ~/.claude-self-reflect/config/

        # Verify config file exists in user directory
        test -f ~/.claude-self-reflect/config/qdrant-config.yaml || {
          echo "❌ qdrant-config.yaml not found in user config directory"
          exit 1
        }
        echo "✅ Config file copied to user directory"

        # Test Docker compose with CONFIG_PATH environment variable
        export CONFIG_PATH=~/.claude-self-reflect/config
        docker compose config > /tmp/compose-rendered.yml

        # Verify the mount path uses CONFIG_PATH (not ./config)
        if grep -q "claude-self-reflect/config/qdrant-config.yaml" /tmp/compose-rendered.yml; then
          echo "✅ Docker compose uses CONFIG_PATH for qdrant-config.yaml mount"
        else
          echo "❌ Docker compose does not use CONFIG_PATH correctly"
          cat /tmp/compose-rendered.yml | grep -A5 "qdrant:"
          exit 1
        fi

        # Verify mount path is within Docker Desktop allowed paths
        if grep -q "/Users/" /tmp/compose-rendered.yml || grep -q "/tmp/" /tmp/compose-rendered.yml; then
          echo "✅ Mount path is within Docker Desktop allowed paths"
        else
          echo "❌ Mount path may not be accessible by Docker Desktop on macOS"
          cat /tmp/compose-rendered.yml | grep -A5 "volumes:"
          exit 1
        fi

        echo "✅ Global install test passed - Docker mount fix verified"

  publish-npm:
    needs: [python-test, npm-package-test, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Publish to npm
      run: |
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Create release archive
      run: |
        mkdir -p /tmp/release
        tar -czf /tmp/release/claude-self-reflect-${{ github.event.release.tag_name }}.tar.gz \
          --exclude='node_modules' \
          --exclude='venv' \
          --exclude='.venv' \
          --exclude='.git' \
          --exclude='data' \
          --exclude='qdrant_storage' \
          --exclude='archived' \
          --exclude='*.tar.gz' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          .
        mv /tmp/release/claude-self-reflect-${{ github.event.release.tag_name }}.tar.gz .
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./claude-self-reflect-${{ github.event.release.tag_name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}