version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/csr-engine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      # rmcp 1.7 breaks Content/RawResource API — migration deferred (#203)
      - dependency-name: "rmcp"
        versions: [">=1.7"]
      # ast-grep 0.43 breaks Language trait API — migration deferred (#207/#208)
      - dependency-name: "ast-grep-core"
        versions: [">=0.43"]
      - dependency-name: "ast-grep-language"
        versions: [">=0.43"]

  # npm installer shim
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
