[package]
name = "csr-engine"
version = "9.2.0"
edition = "2021"
description = "Claude Self-Reflect: Rust MCP server with embedded vector search"

[dependencies]
rmcp = { version = "1.6", features = ["server", "transport-io", "macros", "elicitation"] }
fastembed = "5.9"
hnsw_rs = "0.3"
rusqlite = { version = "0.38", features = ["bundled", "vtab"] }
notify = "8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
schemars = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
sha2 = "0.11"
fs2 = "0.4"
ast-grep-core = { version = "0.42", features = ["tree-sitter"] }
ast-grep-language = { version = "0.42", default-features = false, features = [
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-go",
] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "spike_bench"
harness = false
