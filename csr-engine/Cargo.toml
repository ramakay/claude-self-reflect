[package]
name = "csr-engine"
version = "10.1.0"
edition = "2021"
description = "Claude Self-Reflect: Rust MCP server with embedded vector search"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "elicitation"] }
fastembed = "5.9"
hnsw_rs = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "vtab"] }
notify = "8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
schemars = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
sha2 = "0.11"
blake3 = "1"
fs2 = "0.4"
ast-grep-core = { version = "0.42", features = ["tree-sitter"] }
ast-grep-language = { version = "0.42", default-features = false, features = [
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-go",
] }
ratatui = "0.30"
crossterm = "0.29"
ignore = "0.4"
toml = "0.9"
codewitness = { path = "../codewitness" }
minijinja = "2.22"
# Journal v4 dream server (loopback only). `default-features = false` keeps
# http2, ws, multipart, form and macros OUT of the binary: the server binds
# 127.0.0.1 and serves HTML/JSON over HTTP/1.1 to a local browser, nothing
# else. hyper/hyper-util/tower/tower-http/rustls are already compiled via
# reqwest, so this adds only axum, axum-core, httpdate, matchit and
# serde_path_to_error.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "tracing",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
# Route-level journal tests drive the axum Router through `ServiceExt::oneshot`
# so no socket is ever bound in the test suite. tower 0.5 is already in the
# dependency graph via reqwest/tower-http.
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "spike_bench"
harness = false
